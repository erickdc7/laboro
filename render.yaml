services:
  - type: web
    name: laboro-backend
    runtime: python
    rootDir: backend
    buildCommand: chmod +x render-build.sh && ./render-build.sh
    startCommand: export PATH="${PATH}:/opt/render/project/.render/chrome/opt/google/chrome" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_NAME
        value: Laboro
      - key: DEBUG
        value: false