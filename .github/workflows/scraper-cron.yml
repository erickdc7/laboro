name: Scraper diario

on:
  schedule:
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  run-scrapers:
    runs-on: ubuntu-latest
    steps:
      - name: Scraper de Computrabajo
        run: |
          curl -X POST "https://laboro-backend.onrender.com/scraper/run?source_name=computrabajo" \
            --max-time 600 \
            --fail \
            --show-error

      - name: Scraper de Bumeran
        run: |
          curl -X POST "https://laboro-backend.onrender.com/scraper/run?source_name=bumeran" \
            --max-time 600 \
            --fail \
            --show-error

      - name: Expirar empleos con más de 7 días
        run: |
          curl -X POST "https://laboro-backend.onrender.com/scraper/expire" \
            --max-time 120 \
            --fail \
            --show-error
